#
# Builds every sample and tests them together on the bench of @mosaikit/testing, against the
# latest snapshot of Mosaikit (ADR-0035 of mosaikit/mosaikit). Every night too, so that a change
# of the kernel that breaks a sample shows here the next morning. A tag vX.Y.Z publishes the
# packages in a GitHub release.
name: Samples

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Latest snapshot of Mosaikit
        run: node scripts/use-mosaikit.mjs latest
      - name: Plugin API
        uses: mosaikit/.github/actions/kernel-api@main
        with:
          version: 0.1.0-SNAPSHOT
      - run: npm install --no-audit --no-fund
      - run: mvn --batch-mode --no-transfer-progress package
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Tests on the bench
        run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: samples
          path: |
            packages/
            test-results/
            .mosaikit-bench/test/installation.log
          retention-days: 7
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.zip --verify-tag --generate-notes
